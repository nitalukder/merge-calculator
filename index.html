<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strict Zero-Waste Merge Calculator v1.3.1</title>

    <!-- Tailwind CSS v4 Browser CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Application Logic Script -->
    <script defer src="js/app.js"></script>

    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="mergeCalculator" 
      :class="theme === 'dark' ? 'bg-slate-950 text-slate-100 selection:bg-sky-500 selection:text-white' : 'bg-slate-100 text-slate-800 selection:bg-sky-500 selection:text-white'"
      class="min-h-screen flex items-center justify-center p-4 sm:p-6 antialiased transition-colors duration-300">

    <!-- Main Responsive Container -->
    <main :class="theme === 'dark' ? 'bg-slate-900 border-slate-800 shadow-2xl shadow-black/50' : 'bg-white border-slate-200/80 shadow-2xl shadow-slate-300/50'"
          class="w-full max-w-5xl border rounded-2xl p-6 sm:p-8 transition-colors duration-300">
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- LEFT COLUMN: Header, Theme Switcher & Input Controls -->
            <div class="lg:col-span-5 space-y-6">
                
                <!-- Header with Theme Switcher -->
                <header class="flex items-center justify-between gap-4">
                    <div class="space-y-1">
                        <h1 class="text-2xl font-bold text-sky-500 tracking-tight">Merge Calculator</h1>
                        <p :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'" class="text-xs sm:text-sm">
                            Strict Zero-Waste (5-to-2 Ratio) Logic • v1.3.1
                        </p>
                    </div>

                    <!-- Theme Toggle Button -->
                    <button type="button" @click="toggleTheme()" 
                            aria-label="Toggle Theme"
                            :class="theme === 'dark' ? 'bg-slate-950 hover:bg-slate-800 border-slate-800 text-amber-400' : 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-amber-600'"
                            class="p-2.5 rounded-xl border transition active:scale-95 flex items-center justify-center shrink-0">
                        <!-- Sun Icon (Shown in Dark mode) -->
                        <svg x-show="theme === 'dark'" style="display: none;" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <!-- Moon Icon (Shown in Light mode) -->
                        <svg x-show="theme === 'light'" style="display: none;" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                </header>

                <!-- Input Controls with Stepper Buttons -->
                <section class="space-y-4">
                    <!-- Start Level (s) -->
                    <div>
                        <label :class="theme === 'dark' ? 'text-slate-300' : 'text-slate-700'" class="block text-xs font-medium mb-1.5">Start Level (s)</label>
                        <div class="flex items-center gap-2">
                            <button type="button" @click="decS()" :disabled="s <= 1" aria-label="Decrease start level"
                                    :class="theme === 'dark' ? 'bg-slate-950 hover:bg-slate-800 border-slate-800 text-sky-400' : 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-sky-600'"
                                    class="w-10 h-10 flex items-center justify-center active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed disabled:active:scale-100 font-bold rounded-xl border transition text-lg select-none">
                                -
                            </button>
                            <input type="number" x-model.number="s" @focus="touched = true" min="1" step="1" inputmode="numeric" pattern="[0-9]*"
                                   :class="theme === 'dark' ? 'bg-slate-950 border-slate-800 text-slate-100' : 'bg-slate-50/50 border-slate-300 text-slate-900'"
                                   class="w-full border rounded-xl px-3 py-2 text-center font-mono text-base focus:outline-none focus:ring-2 focus:ring-sky-500 transition [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                            <button type="button" @click="incS()" aria-label="Increase start level"
                                    :class="theme === 'dark' ? 'bg-slate-950 hover:bg-slate-800 border-slate-800 text-sky-400' : 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-sky-600'"
                                    class="w-10 h-10 flex items-center justify-center active:scale-95 font-bold rounded-xl border transition text-lg select-none">
                                +
                            </button>
                        </div>
                    </div>

                    <!-- Target Level (t) -->
                    <div>
                        <label :class="theme === 'dark' ? 'text-slate-300' : 'text-slate-700'" class="block text-xs font-medium mb-1.5">Target Level (t)</label>
                        <div class="flex items-center gap-2">
                            <button type="button" @click="decT()" :disabled="t <= 2" aria-label="Decrease target level"
                                    :class="theme === 'dark' ? 'bg-slate-950 hover:bg-slate-800 border-slate-800 text-sky-400' : 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-sky-600'"
                                    class="w-10 h-10 flex items-center justify-center active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed disabled:active:scale-100 font-bold rounded-xl border transition text-lg select-none">
                                -
                            </button>
                            <input type="number" x-model.number="t" @focus="touched = true" min="2" step="1" inputmode="numeric" pattern="[0-9]*"
                                   :class="theme === 'dark' ? 'bg-slate-950 border-slate-800 text-slate-100' : 'bg-slate-50/50 border-slate-300 text-slate-900'"
                                   class="w-full border rounded-xl px-3 py-2 text-center font-mono text-base focus:outline-none focus:ring-2 focus:ring-sky-500 transition [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                            <button type="button" @click="incT()" aria-label="Increase target level"
                                    :class="theme === 'dark' ? 'bg-slate-950 hover:bg-slate-800 border-slate-800 text-sky-400' : 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-sky-600'"
                                    class="w-10 h-10 flex items-center justify-center active:scale-95 font-bold rounded-xl border transition text-lg select-none">
                                +
                            </button>
                        </div>
                    </div>

                    <!-- Requested Quantity (q) -->
                    <div>
                        <label :class="theme === 'dark' ? 'text-slate-300' : 'text-slate-700'" class="block text-xs font-medium mb-1.5">Requested Quantity (q)</label>
                        <div class="flex items-center gap-2">
                            <button type="button" @click="decQ()" :disabled="q <= 1" aria-label="Decrease requested quantity"
                                    :class="theme === 'dark' ? 'bg-slate-950 hover:bg-slate-800 border-slate-800 text-sky-400' : 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-sky-600'"
                                    class="w-10 h-10 flex items-center justify-center active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed disabled:active:scale-100 font-bold rounded-xl border transition text-lg select-none">
                                -
                            </button>
                            <input type="number" x-model.number="q" @focus="touched = true" min="1" max="1000000" step="1" inputmode="numeric" pattern="[0-9]*"
                                   :class="theme === 'dark' ? 'bg-slate-950 border-slate-800 text-slate-100' : 'bg-slate-50/50 border-slate-300 text-slate-900'"
                                   class="w-full border rounded-xl px-3 py-2 text-center font-mono text-base focus:outline-none focus:ring-2 focus:ring-sky-500 transition [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                            <button type="button" @click="incQ()" :disabled="q >= 1000000" aria-label="Increase requested quantity"
                                    :class="theme === 'dark' ? 'bg-slate-950 hover:bg-slate-800 border-slate-800 text-sky-400' : 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-sky-600'"
                                    class="w-10 h-10 flex items-center justify-center active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed disabled:active:scale-100 font-bold rounded-xl border transition text-lg select-none">
                                +
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Validation Alert with Smooth Transition (Moved Below Input Fields) -->
                <div x-show="error" 
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-start="opacity-0 -translate-y-1"
                     x-transition:enter-end="opacity-100 translate-y-0"
                     x-transition:leave="transition ease-in duration-150"
                     x-transition:leave-start="opacity-100 translate-y-0"
                     x-transition:leave-end="opacity-0 -translate-y-1"
                     style="display: none;"
                     x-text="error" 
                     class="bg-red-500/10 border border-red-500/30 text-red-500 text-xs p-3.5 rounded-xl font-medium">
                </div>

            </div>

            <!-- RIGHT COLUMN: Calculation Results & Step Proof Table -->
            <div class="lg:col-span-7">
                <section :class="[
                            error ? 'opacity-30 pointer-events-none select-none' : '',
                            theme === 'dark' ? 'bg-slate-950/60 border-slate-800/80' : 'bg-slate-50/70 border-slate-200'
                         ]" 
                         class="border rounded-2xl p-5 space-y-5 transition duration-300">
                    
                    <h2 :class="theme === 'dark' ? 'border-slate-800/80 text-sky-400' : 'border-slate-200 text-sky-600'" class="text-xs font-semibold uppercase tracking-wider border-b pb-2.5">
                        Calculation Results
                    </h2>

                    <!-- Summary Stat Cards Grid -->
                    <div class="grid grid-cols-2 gap-3 sm:gap-4">
                        <div :class="theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200/90 shadow-sm'" class="border p-3.5 rounded-xl">
                            <span :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'" class="block text-[11px] font-medium uppercase tracking-wider mb-1">Level Jump (d)</span>
                            <span x-text="error ? '-' : d" :class="theme === 'dark' ? 'text-emerald-400' : 'text-emerald-600'" class="text-xl font-bold font-mono"></span>
                        </div>
                        <div :class="theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200/90 shadow-sm'" class="border p-3.5 rounded-xl">
                            <span :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'" class="block text-[11px] font-medium uppercase tracking-wider mb-1">Batches Needed (b)</span>
                            <span x-text="error ? '-' : b.toLocaleString()" :class="theme === 'dark' ? 'text-emerald-400' : 'text-emerald-600'" class="text-xl font-bold font-mono"></span>
                        </div>
                        <div :class="theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200/90 shadow-sm'" class="border p-3.5 rounded-xl">
                            <span :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'" class="block text-[11px] font-medium uppercase tracking-wider mb-1">Auto Target (q_auto)</span>
                            <span x-text="error ? '-' : qAuto.toLocaleString()" :class="theme === 'dark' ? 'text-emerald-400' : 'text-emerald-600'" class="text-xl font-bold font-mono"></span>
                        </div>
                        <div :class="theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200/90 shadow-sm'" class="border p-3.5 rounded-xl">
                            <span :class="theme === 'dark' ? 'text-slate-400' : 'text-slate-500'" class="block text-[11px] font-medium uppercase tracking-wider mb-1">Start Items (N)</span>
                            <span x-text="error ? '-' : N.toLocaleString()" :class="theme === 'dark' ? 'text-emerald-400' : 'text-emerald-600'" class="text-xl font-bold font-mono"></span>
                        </div>
                    </div>

                    <!-- Step Trace Table -->
                    <div class="space-y-2.5">
                        <h3 :class="theme === 'dark' ? 'text-slate-300' : 'text-slate-700'" class="text-xs font-medium">Step-by-Step Merge Proof</h3>
                        <div :class="theme === 'dark' ? 'border-slate-800/60' : 'border-slate-200 bg-white shadow-sm'" class="overflow-x-auto rounded-lg border">
                            <table class="w-full text-left text-xs">
                                <thead>
                                    <tr :class="theme === 'dark' ? 'bg-slate-900/80 border-slate-800 text-slate-400' : 'bg-slate-100/80 border-slate-200 text-slate-600'" class="border-b">
                                        <th class="py-2.5 px-3 font-medium">Step</th>
                                        <th class="py-2.5 px-3 font-medium">Merged</th>
                                        <th class="py-2.5 px-3 font-medium">Produced</th>
                                        <th class="py-2.5 px-3 font-medium">Waste</th>
                                    </tr>
                                </thead>
                                <tbody :class="theme === 'dark' ? 'divide-slate-800/50 text-slate-200' : 'divide-slate-200 text-slate-700'" class="divide-y">
                                    <template x-for="st in steps" :key="st.lvl">
                                        <tr :class="theme === 'dark' ? 'hover:bg-slate-900/50' : 'hover:bg-slate-50'" class="transition duration-150">
                                            <td class="py-2.5 px-3 font-mono text-sky-500 font-medium" x-text="`L${st.lvl} → L${st.nextLvl}`"></td>
                                            <td class="py-2.5 px-3 font-mono" x-text="st.cur.toLocaleString()"></td>
                                            <td class="py-2.5 px-3 font-mono" x-text="st.next.toLocaleString()"></td>
                                            <td :class="theme === 'dark' ? 'text-emerald-400' : 'text-emerald-600'" class="py-2.5 px-3 font-mono font-semibold" x-text="st.waste"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </section>
            </div>

        </div>

    </main>

</body>
</html>
