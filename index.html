<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strict Zero-Waste Merge Calculator</title>

    <!-- Tailwind CSS v4 Browser CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Application Logic Script -->
    <script src="js/app.js"></script>

    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Main Container -->
    <main x-data="mergeCalculator" class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
        
        <!-- Header -->
        <header class="text-center space-y-1">
            <h1 class="text-2xl font-bold text-sky-400 tracking-tight">Merge Calculator</h1>
            <p class="text-xs sm:text-sm text-slate-400">Strict Zero-Waste (5-to-2 Ratio) Logic</p>
        </header>

        <!-- Validation Alert -->
        <div x-show="error" x-text="error" 
             class="bg-red-500/10 border border-red-500/30 text-red-400 text-xs p-3.5 rounded-xl font-medium">
        </div>

        <!-- Inputs Section with Clear Borders & Backgrounds -->
        <section class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Start Level (s)</label>
                <input type="number" x-model.number="s" min="1" step="1" 
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Target Level (t)</label>
                <input type="number" x-model.number="t" min="2" step="1" 
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Requested Quantity (q)</label>
                <input type="number" x-model.number="q" min="1" step="1" 
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
            </div>
        </section>

        <!-- Results Display Section -->
        <section :class="error ? 'opacity-30 pointer-events-none select-none' : ''" 
                 class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-5 space-y-5 transition duration-300">
            
            <h2 class="text-xs font-semibold text-sky-400 uppercase tracking-wider border-b border-slate-800/80 pb-2.5">
                Calculation Results
            </h2>

            <!-- Summary Stat Cards Grid -->
            <div class="grid grid-cols-2 gap-3 sm:gap-4">
                <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-xl">
                    <span class="block text-[11px] text-slate-400 font-medium uppercase tracking-wider mb-1">Level Jump (d)</span>
                    <span x-text="error ? '-' : d" class="text-xl font-bold text-emerald-400 font-mono"></span>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-xl">
                    <span class="block text-[11px] text-slate-400 font-medium uppercase tracking-wider mb-1">Batches Needed (b)</span>
                    <span x-text="error ? '-' : b.toLocaleString()" class="text-xl font-bold text-emerald-400 font-mono"></span>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-xl">
                    <span class="block text-[11px] text-slate-400 font-medium uppercase tracking-wider mb-1">Auto Target (q_auto)</span>
                    <span x-text="error ? '-' : qAuto.toLocaleString()" class="text-xl font-bold text-emerald-400 font-mono"></span>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-xl">
                    <span class="block text-[11px] text-slate-400 font-medium uppercase tracking-wider mb-1">Start Items (N)</span>
                    <span x-text="error ? '-' : N.toLocaleString()" class="text-xl font-bold text-emerald-400 font-mono"></span>
                </div>
            </div>

            <!-- Step Trace Table -->
            <div class="space-y-2.5">
                <h3 class="text-xs font-medium text-slate-300">Step-by-Step Merge Proof</h3>
                <div class="overflow-x-auto rounded-lg border border-slate-800/60">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="bg-slate-900/80 border-b border-slate-800 text-slate-400">
                                <th class="py-2.5 px-3 font-medium">Step</th>
                                <th class="py-2.5 px-3 font-medium">Merged</th>
                                <th class="py-2.5 px-3 font-medium">Produced</th>
                                <th class="py-2.5 px-3 font-medium">Waste</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-800/50 text-slate-200">
                            <template x-for="st in steps" :key="st.lvl">
                                <tr class="hover:bg-slate-900/50 transition duration-150">
                                    <td class="py-2.5 px-3 font-mono text-sky-400 font-medium" x-text="`L${st.lvl} → L${st.nextLvl}`"></td>
                                    <td class="py-2.5 px-3 font-mono" x-text="st.cur.toLocaleString()"></td>
                                    <td class="py-2.5 px-3 font-mono" x-text="st.next.toLocaleString()"></td>
                                    <td class="py-2.5 px-3 font-mono font-semibold text-emerald-400" x-text="st.waste"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
